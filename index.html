<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6EA">
<meta name="description" content="Merlin GS Quests — short, playful NGS Term 1 revision missions for Primary 3.">
<title>Merlin GS Quests · NGS Term 1</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='26' fill='%23FF7A59'/%3E%3Ccircle cx='32' cy='36' r='22' fill='%23FFF6EA'/%3E%3Cpath d='M32 6l-4 8h8z' fill='%237C6BF0'/%3E%3Ccircle cx='24' cy='34' r='4' fill='%2333305C'/%3E%3Ccircle cx='40' cy='34' r='4' fill='%2333305C'/%3E%3Cpath d='M26 44c4 3 8 3 12 0' stroke='%23FF7A59' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* ============ Merlin GS Quests — app styles ============ */
:root{
  --bg:#FFF6EA; --ink:#33305C; --ink-soft:#6B678F; --card:#FFFFFF; --line:#F0E7D6;
  --coral:#FF7A59; --coral-deep:#F2603C; --gold:#FFC53D; --gold-deep:#F5A800;
  --green:#2BAE8A; --violet:#7C6BF0; --good:#2FBF71; --bad:#E85D75;
  --radius:20px; --shadow:0 6px 18px rgba(76,60,40,.10);
  --font:'Baloo 2', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0}
html{scroll-behavior:auto}
body{
  font-family:var(--font); color:var(--ink); background:var(--bg); font-size:17px; line-height:1.45;
  background-image:radial-gradient(560px 340px at 8% -6%, rgba(255,197,61,.28), transparent 65%),
                   radial-gradient(520px 360px at 100% 4%, rgba(255,122,89,.16), transparent 62%),
                   radial-gradient(640px 420px at 50% 108%, rgba(124,107,240,.14), transparent 60%);
  background-attachment:fixed; min-height:100dvh;
}
button{font-family:inherit; font-size:inherit; color:inherit; border:0; background:none; cursor:pointer; touch-action:manipulation}
.app{max-width:560px; margin:0 auto; padding:0 16px calc(24px + env(safe-area-inset-bottom)); min-height:100dvh}
.hidden{display:none!important}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:10px;
  padding:10px 2px; margin-bottom:6px; background:linear-gradient(var(--bg) 72%, transparent);
}
.brand{display:flex; align-items:center; gap:9px; margin-right:auto}
.brand .logo{width:40px; height:40px; flex:none}
.brand h1{font-size:19px; font-weight:800; letter-spacing:.2px}
.brand small{display:block; font-size:11.5px; color:var(--ink-soft); font-weight:600; line-height:1.1}
.icon-btn{
  width:44px; height:44px; border-radius:14px; background:var(--card); box-shadow:var(--shadow);
  display:inline-flex; align-items:center; justify-content:center; color:var(--ink); flex:none;
  transition:transform .12s ease;
}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:22px; height:22px}

/* ---------- generic buttons ---------- */
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px; min-height:52px; width:100%;
  border-radius:16px; font-weight:800; font-size:17px; padding:10px 16px;
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:active{transform:scale(.965)}
.btn-primary{background:var(--coral); color:#fff; box-shadow:0 6px 16px rgba(255,122,89,.38)}
.btn-gold{background:var(--gold); color:#5B3E00; box-shadow:0 6px 16px rgba(245,168,0,.34)}
.btn-ghost{background:var(--card); color:var(--ink); box-shadow:var(--shadow)}
.btn-violet{background:var(--violet); color:#fff; box-shadow:0 6px 16px rgba(124,107,240,.34)}
.btn svg{width:20px; height:20px; flex:none}
.btn-row{display:flex; gap:10px}
.btn-row .btn{flex:1}

/* ---------- home ---------- */
.hero{display:flex; align-items:center; gap:14px; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin:8px 0 14px}
.hero .owl{width:92px; height:92px; flex:none; animation:owlFloat 3.4s ease-in-out infinite}
.hero h2{font-size:21px; font-weight:800; line-height:1.2}
.hero p{color:var(--ink-soft); font-weight:600; font-size:14px; margin-top:2px}
.chip{
  display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:6px 12px; border-radius:999px;
  background:var(--card); box-shadow:var(--shadow); font-weight:700; font-size:14px; color:var(--ink-soft);
  border:2px solid transparent; transition:all .15s ease;
}
.chip.on{color:var(--ink); border-color:var(--gold); background:#FFF9E8}
.chip svg{width:17px; height:17px}
.settings{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px; align-items:center}
.settings .spacer{flex:1}
.quests-head{display:flex; align-items:baseline; justify-content:space-between; margin:16px 2px 8px}
.quests-head h3{font-size:17px; font-weight:800}
.quests-head .note{font-size:12.5px; color:var(--ink-soft); font-weight:600}
.chap{
  display:flex; align-items:center; gap:12px; background:var(--card); border-radius:18px; box-shadow:var(--shadow);
  padding:13px 14px; margin-bottom:10px; width:100%; text-align:left; position:relative; overflow:hidden;
  transition:transform .12s ease;
}
.chap:active{transform:scale(.975)}
.chap .tile{width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:27px; flex:none; color:#fff}
.chap .info{flex:1; min-width:0}
.chap .info b{display:block; font-size:16.5px; font-weight:800; line-height:1.2}
.chap .info .pages{font-size:12px; color:var(--ink-soft); font-weight:600}
.chap .stars{font-size:12.5px; color:var(--gold-deep); font-weight:700; white-space:nowrap}
.meter{height:8px; border-radius:99px; background:#F1EADB; overflow:hidden; margin-top:6px}
.meter i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--gold),#FFB020); width:0%; transition:width .5s ease}
.meter-label{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-soft); font-weight:600; margin-top:3px}
.cta-wrap{display:flex; flex-direction:column; gap:10px; margin-top:14px}
.cta-big{min-height:64px; font-size:19px; border-radius:18px}
.cta-big .sub{display:block; font-size:12.5px; font-weight:600; opacity:.85}
.mix-tip{font-size:12.5px; color:var(--ink-soft); text-align:center; font-weight:600; margin-top:6px}

/* ---------- play / question ---------- */
.topbar{display:flex; align-items:center; gap:8px; margin:4px 0 10px}
.topbar .label{font-weight:800; font-size:14.5px; white-space:nowrap}
.topbar .spacer{flex:1}
.stat{display:inline-flex; align-items:center; gap:5px; background:var(--card); box-shadow:var(--shadow); border-radius:12px; padding:5px 10px; font-weight:800; font-size:14px; min-height:38px}
.stat svg{width:17px; height:17px}
.stat .t{font-variant-numeric:tabular-nums}
.timer.warn{animation:timerPulse .8s ease-in-out infinite; color:var(--bad)}
.timerbar{height:6px; border-radius:99px; background:#F1EADB; overflow:hidden; margin:0 0 12px}
.timerbar i{display:block; height:100%; width:100%; background:var(--coral); transition:width .9s linear}
.dots{display:flex; gap:5px; justify-content:center; margin:10px 0 12px}
.dots span{width:9px; height:9px; border-radius:99px; background:#E7DCC4; transition:all .2s}
.dots span.done{background:var(--gold)}
.dots span.now{background:var(--coral); transform:scale(1.35)}
.qcard{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 16px; animation:cardIn .32s ease}
.qcard .q-tag{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px}
.qcard .q-tag svg{width:15px; height:15px}
.qcard .prompt{font-size:20px; font-weight:800; line-height:1.35}
.qcard .prompt-sub{font-size:14.5px; color:var(--ink-soft); font-weight:600; margin-top:6px}
.read-btn{margin-top:10px}
.opt{
  display:flex; align-items:center; gap:10px; width:100%; min-height:54px; margin-top:10px; padding:10px 14px;
  background:#FBF6EA; border:2.5px solid #EFE3CC; border-radius:15px; font-weight:700; font-size:16px; text-align:left;
  transition:transform .12s ease, background .15s, border-color .15s;
}
.opt:active{transform:scale(.98)}
.opt .e{font-size:22px; flex:none}
.opt.ok{background:#E9F9EF; border-color:var(--good); animation:pop .3s ease}
.opt.no{background:#FDEAEE; border-color:var(--bad); animation:shake .4s ease}
.why{margin-top:12px; background:#FFF6E3; border:2px dashed var(--gold); border-radius:14px; padding:12px 14px; font-size:15px; font-weight:600; color:#6B4A00; animation:cardIn .3s ease}
.why b{display:block; margin-bottom:2px; font-size:13px; letter-spacing:.5px; text-transform:uppercase; color:var(--gold-deep)}
.tf-row{display:flex; gap:12px; margin-top:12px}
.tf-btn{flex:1; min-height:60px; border-radius:15px; background:#FBF6EA; border:2.5px solid #EFE3CC; font-weight:800; font-size:19px; display:flex; align-items:center; justify-content:center; gap:8px; transition:all .12s}
.tf-btn:active{transform:scale(.97)}
.tf-btn.ok{background:#E9F9EF; border-color:var(--good); animation:pop .3s ease}
.tf-btn.no{background:#FDEAEE; border-color:var(--bad); animation:shake .4s ease}
.buckets{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
.bucket{background:#FBF6EA; border:2.5px solid #EFE3CC; border-radius:15px; padding:10px 8px; min-height:120px}
.bucket h4{font-size:13.5px; font-weight:800; text-align:center; margin-bottom:8px; color:var(--ink-soft)}
.bucket .chip-item{display:block; width:100%; margin:5px 0; padding:7px 6px; border-radius:10px; font-size:12.5px; font-weight:700; line-height:1.2}
.chip-item{background:#fff; border:2px solid #E7DCC4; text-align:center}
.chip-item.selA{background:#E9F9EF; border-color:var(--green)}
.chip-item.selB{background:#EAF0FF; border-color:var(--violet)}
.chip-item.bad{background:#FDEAEE; border-color:var(--bad); animation:shake .4s ease}
.order-wrap{margin-top:12px}
.order-src{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
.order-src button{padding:8px 12px; border-radius:12px; background:#FBF6EA; border:2px solid #EFE3CC; font-weight:700; font-size:14.5px}
.order-src button:disabled{opacity:.35}
.order-slots{display:flex; flex-direction:column; gap:6px}
.order-slot{min-height:44px; border:2px dashed #E0D3B8; border-radius:12px; padding:6px 10px; font-weight:700; font-size:14.5px; display:flex; align-items:center; gap:8px}
.order-slot .n{color:var(--gold-deep); font-weight:800}
.order-slot button{margin-left:auto; color:var(--bad); font-weight:800; font-size:15px; padding:4px}
.pairs{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px}
.pair-col{display:flex; flex-direction:column; gap:8px}
.pair-col h5{font-size:12px; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-soft); font-weight:800; text-align:center}
.pair-item{min-height:52px; border-radius:13px; background:#FBF6EA; border:2.5px solid #EFE3CC; font-weight:700; font-size:14.5px; display:flex; align-items:center; justify-content:center; gap:6px; padding:6px; text-align:center; transition:all .12s}
.pair-item.sel{background:#FFF6E3; border-color:var(--gold)}
.pair-item.ok{background:#E9F9EF; border-color:var(--good); animation:pop .3s ease}
.pair-item.bad{background:#FDEAEE; border-color:var(--bad); animation:shake .4s ease}
.pair-item .e{font-size:20px}
.fill-sent{font-size:18px; font-weight:800; line-height:1.55; margin:12px 0}
.fill-sent u{color:var(--coral-deep); text-decoration:none; background:#FFF0E8; border-radius:8px; padding:0 8px}
.fill-bank{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.fill-bank button{padding:9px 14px; border-radius:12px; background:#FBF6EA; border:2px solid #EFE3CC; font-weight:700; font-size:15px}
.fill-bank button:disabled{opacity:.35}
.recall{margin-top:12px}
.recall .facts{background:#F7F3FF; border:2px solid #E2DAFF; border-radius:14px; padding:12px 14px; font-weight:700; font-size:15px}
.recall .facts li{margin:4px 0 4px 18px}
.teach-bank{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.teach-bank button{padding:9px 12px; border-radius:12px; background:#FBF6EA; border:2px solid #EFE3CC; font-weight:700; font-size:13.5px}
.teach-bank button.pick{background:#E9F9EF; border-color:var(--good)}
.check-row{margin-top:14px}
.next-row{margin-top:14px}

/* ---------- mascot ---------- */
.mascot-line{display:flex; align-items:flex-end; gap:10px; margin-top:14px; min-height:70px}
.mascot-line .owl-sm{width:52px; height:52px; flex:none}
.bubble{background:var(--card); box-shadow:var(--shadow); border-radius:16px 16px 16px 4px; padding:10px 14px; font-weight:700; font-size:15px; max-width:82%; animation:cardIn .3s ease}

/* ---------- done ---------- */
.done-hero{text-align:center; padding:26px 10px 10px}
.done-hero .big-star{font-size:56px; animation:starSpin 1.2s ease}
.done-hero h2{font-size:26px; font-weight:800}
.done-hero p{color:var(--ink-soft); font-weight:600; margin-top:4px}
.star-row{display:flex; justify-content:center; gap:8px; margin:16px 0 4px}
.star-cell{width:66px; background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:10px 4px; text-align:center}
.star-cell svg{width:26px; height:26px}
.star-cell b{display:block; font-size:17px}
.star-cell small{font-size:11px; color:var(--ink-soft); font-weight:700}
.stats-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0}
.stat-card{background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:12px; text-align:center}
.stat-card b{font-size:22px; display:block}
.stat-card small{font-size:12px; color:var(--ink-soft); font-weight:700}
.mastery-move{background:#FFF6E3; border:2px dashed var(--gold); border-radius:16px; padding:12px 14px; margin:14px 0; font-size:14px; font-weight:700}
.mastery-move b{display:block; font-size:13px; letter-spacing:.5px; text-transform:uppercase; color:var(--gold-deep); margin-bottom:4px}
.confetti-bit{position:fixed; top:-14px; width:10px; height:14px; border-radius:3px; z-index:60; pointer-events:none; animation:confettiFall 2.6s linear forwards}

/* ---------- parent coach ---------- */
.parent-head{display:flex; align-items:center; gap:12px; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin:8px 0 14px}
.parent-head .icon{width:48px; height:48px; border-radius:15px; background:#F3F0FF; color:var(--violet); display:flex; align-items:center; justify-content:center; flex:none}
.parent-head h2{font-size:19px; font-weight:800}
.parent-head p{font-size:12.5px; color:var(--ink-soft); font-weight:600}
.panel{background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:14px 16px; margin-bottom:12px}
.panel h3{font-size:15px; font-weight:800; margin-bottom:8px; display:flex; align-items:center; gap:7px}
.panel h3 svg{width:18px; height:18px; color:var(--coral)}
.oral-q{background:#F7F3FF; border:2px solid #E2DAFF; border-radius:14px; padding:12px 14px; margin-top:10px}
.oral-q .q{font-weight:800; font-size:15.5px}
.oral-q .a{margin-top:6px; font-size:13.5px; color:var(--ink-soft); font-weight:600}
.oral-q .can{margin-top:6px; font-size:13.5px; font-weight:700; color:var(--violet)}
.weak-row{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line)}
.weak-row:last-child{border-bottom:0}
.weak-row .dot{width:34px; height:34px; border-radius:10px; background:#FDEAEE; color:var(--bad); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex:none}
.weak-row .t{font-weight:700; font-size:13.5px; flex:1; min-width:0}
.weak-row .t small{display:block; color:var(--ink-soft); font-weight:600}
.weak-row .p{font-size:12.5px; color:var(--ink-soft); font-weight:700}
.zh-tip{background:#FFF6E3; border:2px dashed var(--gold); border-radius:14px; padding:10px 14px; font-size:14px; font-weight:700; color:#6B4A00; margin-top:10px}

/* ---------- toast ---------- */
#toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(80px); background:var(--ink); color:#fff; padding:11px 18px; border-radius:99px; font-weight:700; font-size:14.5px; z-index:80; opacity:0; transition:all .3s ease; max-width:88%; text-align:center; pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0); opacity:1}

/* ---------- star burst ---------- */
.burst{position:fixed; pointer-events:none; z-index:70}
.burst span{position:absolute; font-size:20px; animation:burstFly .8s ease-out forwards}

/* ---------- keyframes ---------- */
@keyframes cardIn{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
@keyframes pop{0%{transform:scale(1)} 45%{transform:scale(1.05)} 100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)}}
@keyframes owlFloat{0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-7px) rotate(2deg)}}
@keyframes timerPulse{0%,100%{opacity:1} 50%{opacity:.55}}
@keyframes burstFly{from{opacity:1; transform:translate(0,0) scale(1)} to{opacity:0; transform:translate(var(--dx),var(--dy)) scale(1.4)}}
@keyframes confettiFall{0%{transform:translateY(-16px) rotate(0)} 100%{transform:translateY(110vh) rotate(640deg); opacity:.9}}
@keyframes starSpin{0%{transform:scale(0) rotate(-60deg)} 70%{transform:scale(1.25) rotate(8deg)} 100%{transform:scale(1) rotate(0)}}
@keyframes flamePulse{0%,100%{transform:scale(1)} 50%{transform:scale(1.18)}}
.flame-hot svg{animation:flamePulse .5s ease-in-out infinite}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s!important; animation-iteration-count:1!important; transition-duration:.001s!important}
  .confetti-bit{display:none}
}

@media (max-width:379px){
  body{font-size:16px}
  .qcard .prompt{font-size:18px}
  .stat{font-size:13px; padding:5px 8px}
}
</style>
</head>
<body>
<div class="app" id="app">

  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="37" r="26" fill="#FF7A59"/><circle cx="32" cy="37" r="22" fill="#FFF6EA"/><path d="M32 7l-5 9h10z" fill="#7C6BF0"/><circle cx="24" cy="36" r="4" fill="#33305C"/><circle cx="40" cy="36" r="4" fill="#33305C"/><path d="M26 45c4 3 8 3 12 0" stroke="#FF7A59" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      <div><h1>Merlin GS Quests</h1><small>NGS Term 1 · P3 · short missions</small></div>
    </div>
    <button class="icon-btn" id="btn-sound" aria-label="Sound" data-action="toggle-sound"></button>
    <button class="icon-btn" id="btn-home" aria-label="Home" data-action="go-home"></button>
  </header>

  <main>

    <!-- ================= HOME ================= -->
    <section id="view-home" class="view">
      <div class="hero">
        <svg class="owl" viewBox="0 0 120 120" aria-hidden="true">
          <path d="M60 14l-7 13h14z" fill="#7C6BF0"/>
          <ellipse cx="60" cy="66" rx="42" ry="40" fill="#FFD9C9"/>
          <ellipse cx="60" cy="66" rx="34" ry="32" fill="#FFF6EA"/>
          <path d="M26 52c-8 6-10 20-4 30 3 5 9 7 14 5-6-8-8-22-2-33z" fill="#FFC53D"/>
          <path d="M94 52c8 6 10 20 4 30-3 5-9 7-14 5 6-8 8-22 2-33z" fill="#FFC53D"/>
          <circle cx="46" cy="62" r="9" fill="#fff"/><circle cx="46" cy="62" r="4.6" fill="#33305C"/>
          <circle cx="74" cy="62" r="9" fill="#fff"/><circle cx="74" cy="62" r="4.6" fill="#33305C"/>
          <path d="M50 82c6 4.6 14 4.6 20 0" stroke="#FF7A59" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M20 40c2-6 8-10 14-10M100 40c-2-6-8-10-14-10" stroke="#7C6BF0" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
        <div>
          <h2>Ready for a quest, Merlin?</h2>
          <p>Short missions · brain boost · stars &amp; streaks</p>
        </div>
      </div>

var STORE_KEY = 'mgq-quests-v1';
var store = { mastery:{}, acc:{}, settings:{sound:true, timerMin:6, shuffle:true, mixFresh:true}, log:{totalStars:0, missions:0, bestStreak:0, lastChapter:''} };

function storeLoad(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw) return;
    var d = JSON.parse(raw);
    store.mastery = d.mastery || {};
    store.acc = d.acc || {};
    store.settings = Object.assign(store.settings, d.settings || {});
    store.log = Object.assign(store.log, d.log || {});
  }catch(e){ /* fresh start */ }
}
function storeSave(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){}
}
function recordAnswer(factId, chapterId, firstTry, stars){
  var a = store.acc[factId] || {a:0, c:0};
  a.a += 1; if(firstTry) a.c += 1;
  store.acc[factId] = a;
  var m = store.mastery[chapterId] || {stars:0, plays:0};
  m.stars += stars; m.plays += 1;
  store.mastery[chapterId] = m;
  store.log.totalStars += stars;
  storeSave();
}
function accuracyOf(factId){
  var a = store.acc[factId]; if(!a || !a.a) return null;
  return a.c / a.a;
}
function chapterMastery(chapterId){
  var m = store.mastery[chapterId];
  if(!m || !m.plays) return 0;
  return Math.min(100, Math.round(100 * m.stars / (m.plays * 3)));
}

var AudioX = {
  ctx: null, muted: false,
  ensure: function(){
    if(!this.ctx){
      try{
        var AC = window.AudioContext || window.webkitAudioContext;
        if(AC) this.ctx = new AC();
      }catch(e){ this.ctx = null; }
    }
    if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone: function(freq, dur, type, gainVal, when){
    if(this.muted || !this.ctx) return;
    var t = this.ctx.currentTime + (when || 0);
    var o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gainVal || 0.16, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  },
  tap: function(){ this.tone(720, 0.08, 'sine', 0.10); },
  correct: function(){ this.tone(660, 0.16, 'sine', 0.16); this.tone(880, 0.20, 'sine', 0.14, 0.10); },
  wrong: function(){ this.tone(233, 0.26, 'triangle', 0.12); this.tone(196, 0.30, 'triangle', 0.10, 0.12); },
  pair: function(){ this.tone(880, 0.12, 'sine', 0.14); },
  streak: function(n){
    var base = 523, self = this;
    [0,1,2,3].forEach(function(i){ if(i < n) self.tone(base * Math.pow(1.26, i), 0.14, 'sine', 0.13, i * 0.08); });
  },
  complete: function(){
    var self = this;
    [523,659,784,1046].forEach(function(f,i){ self.tone(f, 0.22, 'sine', 0.15, i * 0.13); });
    self.tone(1318, 0.4, 'sine', 0.13, 0.55);
  },
  speak: function(text){
    if(this.muted) return;
    try{
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 0.92; u.pitch = 1.05; u.volume = 0.95;
      u.lang = 'en-GB';

      if(v) u.voice = v;

  },
  stopSpeak: function(){ try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){} }
};

  var cands = shuffle(fromSame.concat(poolArr));
  for(var i = 0; i < cands.length && opts.length < n; i++){

    var all = allFacts();
    var chosen = weightedMix(all, Math.min(n, all.length));
    chosen.forEach(function(f){ S.cards.push({ fact:f, type:pickType(f) }); });
  }
  S.timeLeft = store.settings.timerMin * 60;
}
function pickType(f){
  var ts = typesFor(f);
  if(ts.length <= 1) return ts[0];
  var last = S.lastType[f.id];
  var opts = ts.filter(function(t){ return t !== last; });
  var t = pick(opts.length ? opts : ts);
  S.lastType[f.id] = t;
  return t;
}
function weightedMix(facts, n){
  var w = facts.map(function(f){
    var a = accuracyOf(f.id);
    if(a === null) return 1;
    return 1 / (a + 0.12);            /* weaker topics get heavier weight */
  });
  var total = w.reduce(function(x,y){ return x+y; }, 0);
  var chosen = [];
  var picked = {};
  for(var k = 0; k < n; k++){
    var r = Math.random() * total;
    var acc = 0, sel = -1;
    for(var i = 0; i < facts.length; i++){
      if(picked[facts[i].id]) continue;
      acc += w[i];
      if(r <= acc){ sel = i; break; }
    }
    if(sel < 0){ for(var j = 0; j < facts.length; j++){ if(!picked[facts[j].id]){ sel = j; break; } } }
    if(sel < 0) break;
    chosen.push(facts[sel]); picked[facts[sel].id] = true;
  }
  /* spread: if a chapter is missing and we have room, swap one in */
  var chs = {};
  CARDS.units.forEach(function(u){ u.chapters.forEach(function(c){ chs[c.id] = c.facts; }); });
  var present = {};
  chosen.forEach(function(f){ present[chapterOf(f).id] = true; });
  Object.keys(chs).forEach(function(cid){
    if(present[cid] || chosen.length >= n) return;
    var spare = null, idx = -1;
    for(var i = 0; i < chosen.length; i++){
      var cf = chapterOf(chosen[i]).id;
      if(chosen.filter(function(x){ return chapterOf(x).id === cf; }).length > 1){ spare = chosen[i]; idx = i; break; }
    }
    if(spare){
      var alt = chs[cid].filter(function(f){ return !picked[f.id]; });
      if(alt.length){ chosen[idx] = alt[0]; present[cid] = true; }
    }
  });
  return chosen;
}

/* ---------- question builders ---------- */
function buildQuestion(f, type){
  switch(type){
    case 'mcq':      return qMcq(f, false);
    case 'scenario': return qMcq(f, true);
    case 'mistake':  return qMistake(f);
    case 'tf':       return qTf(f);
    case 'sort':     return qSort(f);
    case 'order':    return qOrder(f);
    case 'match':    return qMatch(f);
    case 'fill':     return qFill(f);
    case 'teach':    return qTeach(f);
  }
}
function freshOptions(f, correctList, wrongList){
  var correct = pick(correctList);
  var n = 4;
  var same = wrongList.filter(function(w){ return w !== correct; });
  var opts = makeOptions(correct, same, pool(), n);
  var key = optionOrderKey(opts);
  var tries = 0;
  while(S.lastOrder[f.id] === key && tries < 8){
    opts = makeOptions(correct, same, pool(), n);
    key = optionOrderKey(opts); tries++;
  }
  S.lastOrder[f.id] = key;
  return opts;
}
function qMcq(f, isScenario){
  var opts = freshOptions(f, f.good, f.bad);
  var stem, sub = null;
  if(isScenario){ stem = f.scenario; sub = 'What is the best thing to do?'; }
  else if(Math.random() < 0.5){ stem = pick(['Which should you do?','Which is a good idea?','Pick the right choice.']); }
  else { stem = pick(['Which should you NOT do?','Which is NOT a good idea?','Pick the wrong choice.']);
         opts = opts.map(function(o){ return { t:o.t, ok:!o.ok }; }); }
  return { type:'mcq', stem:stem, sub:sub, opts:opts, why:f.why };
}
function qMistake(f){
  var opts = freshOptions(f, f.bad, f.good);
  var stem = f.scenario || 'Find the mistake in this scene.';
  return { type:'mcq', stem:stem, sub:'Which one is the mistake?', opts:opts, why:f.why };
}
function qTf(f){
  var fromGood = Math.random() < 0.5;
  var list = fromGood ? f.good : f.bad;
  var st = pick(list);
  return { type:'tf', stem:st, answer:fromGood, why:f.why };
}
function qSort(f){
  var lbl = f.buckets || ['Good idea', 'Not a good idea'];
  var items = [];
  f.good.forEach(function(g){ items.push({ t:g, target:0 }); });
  f.bad.forEach(function(b){ items.push({ t:b, target:1 }); });
  return { type:'sort', stem:'Tap each card, then choose its bucket.', labels:lbl, items:shuffle(items), why:f.why };
}
function qOrder(f){
  return { type:'order', stem:'Tap the steps in the right order.', steps:f.steps, why:f.why };
}
function qMatch(f){
  var pairs = f.pairs.length > 4 ? sample(f.pairs, 4) : f.pairs;
  var left = pairs.map(function(p){ return p[0]; });
  var right = shuffle(pairs.map(function(p){ return p[1]; }));
  var map = {};
  pairs.forEach(function(pr){ map[pr[1]] = pr[0]; });
  return { type:'match', stem:'Tap a card on each side to match them.', left:left, right:right, map:map, why:f.why };
}
function qFill(f){
  return { type:'fill', stem:f.fill.text, answer:f.fill.answer, bank:shuffle(f.fill.bank.slice()), why:f.why };
}
function qTeach(f){
  var distract = sample(f.bad.filter(function(b){ return f.keywords.indexOf(b) < 0; }), 2);
  var bank = shuffle(f.keywords.slice().concat(distract));
  return { type:'teach', stem:'Read or listen, then tap the words you remember.', facts:f.facts.slice(), bank:bank, answers:f.keywords.slice(), why:f.why };
}

/* ---------- session flow ---------- */
function currentCard(){ return S.cards[S.idx]; }
function cardProgress(){
  var d = document.getElementById('dots');
  d.innerHTML = '';
  S.cards.forEach(function(c, i){
    var s = document.createElement('span');
    if(i < S.idx) s.className = 'done';
    if(i === S.idx) s.className = 'now';
    d.appendChild(s);
  });
}
function updateHud(){
  document.getElementById('stars-text').textContent = S.stars;
  document.getElementById('streak-text').textContent = S.streak;
  document.getElementById('timer-text').textContent = fmtTime(S.timeLeft);
  var tb = document.getElementById('timer-bar');
  var total = S.mode === 'lightning' ? 60 : store.settings.timerMin * 60;
  tb.style.width = Math.max(0, Math.round(100 * S.timeLeft / total)) + '%';
  var el = document.getElementById('stat-timer');
  el.classList.toggle('warn', S.timeLeft <= 60);
  var flame = document.getElementById('stat-streak');
  flame.classList.toggle('flame-hot', S.streak >= 3);
}
function startTimer(){
  clearInterval(S.timerId);
  updateHud();
  S.timerId = setInterval(function(){
    S.timeLeft -= 1;
    if(S.timeLeft <= 0){ S.timeLeft = 0; updateHud(); endMission('time'); return; }
    updateHud();
  }, 1000);
}
function recordCorrect(){
  var c = currentCard();
  var st = S.factState[c.fact.id] || { attempts:0 };
  var firstTry = st.attempts === 0;
  var stars = S.mode === 'lightning' ? 1 : Math.max(1, 3 - st.attempts);
  S.stars += stars;
  if(firstTry){ S.streak += 1; S.best = Math.max(S.best, S.streak); }
  else { S.streak = 0; }
  recordAnswer(c.fact.id, chapterOf(c.fact).id, firstTry, stars);
  return { stars:stars, firstTry:firstTry };
}
function onWrong(){
  var c = currentCard();
  var st = S.factState[c.fact.id] || { attempts:0 };
  st.attempts += 1;
  S.factState[c.fact.id] = st;
  S.streak = 0;
  updateHud();
}
function advance(){
  S.idx += 1;
  if(S.idx >= S.cards.length){ endMission('done'); return; }
  renderQuestion();
}
function endMission(reason){
  if(S.finished) return;
  S.finished = true;
  clearInterval(S.timerId);
  AudioX.stopSpeak();
  if(reason === 'time') toast('Time is up — great job!');
  else if(reason === 'early') toast('Good quest! Come back for more.');
  store.log.missions += 1;
  store.log.bestStreak = Math.max(store.log.bestStreak, S.best);
  if(S.mode === 'chapter') store.log.lastChapter = S.chapterId;
  storeSave();
  var ratio = S.cards.length ? S.stars / (S.cards.length * 3) : 0;
  if(ratio >= 0.6) confetti(30);
  AudioX.complete();
  renderDone(reason);
}

function renderSort(q){
  var a = qarea();

  card.className = 'qcard';
  q._qcard = card;
  card.innerHTML = '<div class="q-tag">Sort it</div><div class="prompt">' + q.stem + '</div>';
  var buckets = document.createElement('div');
  buckets.className = 'buckets';
  var cols = [];
  q.labels.forEach(function(l, i){
    var col = document.createElement('div');
    col.className = 'bucket';
    col.innerHTML = '<h4>' + l + '</h4>';
    buckets.appendChild(col);
    cols.push(col);
  });
  var items = {};
  q.items.forEach(function(it){
    var b = document.createElement('button');
    b.className = 'chip-item';
    b.textContent = it.t;

      else { b.remove(); b.dataset.slot = 'none'; }
      // if removed from a column, put it back into the pool row
      if(b.dataset.slot === 'none'){ itemPool.appendChild(b); b.className = 'chip-item'; }
    });
    items[it.t] = { it:it, el:b };
  });
  var pool = document.createElement('div');
  pool.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;margin-top:12px';
  var itemPool = pool;
  q.items.forEach(function(it){ pool.appendChild(items[it.t].el); });
  card.appendChild(pool);
  card.appendChild(buckets);
  var check = document.createElement('button');
  check.className = 'btn btn-primary check-row';
  check.textContent = 'Check';
  check.addEventListener('click', function(){
    var wrong = false;
    q.items.forEach(function(it){
      var b = items[it.t].el;
      var slot = parseInt(b.dataset.slot, 10);
      if(isNaN(slot) || slot !== it.target){
        if(!b.dataset.shook){
          b.dataset.shook = '1';
          b.classList.add('bad');
          setTimeout(function(){
            b.classList.add('shake');
            setTimeout(function(){ b.classList.remove('shake'); b.dataset.shook = ''; }, 500);
          }, 40);
        } else {
          b.classList.add('bad');
        }
        wrong = true;
      }
    });
    if(wrong){
      AudioX.wrong(); onWrong(); updateHud();
      mascotSay(pick(ENCOURAGE) + ' Tap the red cards to move them.');
      return;
    }
    recordCorrect(); updateHud();
    check.disabled = true;
    celebrate(check, q);
  });
  card.appendChild(check);
  a.appendChild(card);
}

/* --- order --- */
function renderOrder(q){
  var a = qarea();
  var card = document.createElement('div');
  card.className = 'qcard';
  q._qcard = card;
  card.innerHTML = '<div class="q-tag">Order the steps</div><div class="prompt">' + q.stem + '</div>';
  var src = document.createElement('div');
  src.className = 'order-src';
  var srcPool = shuffle(q.steps.map(function(s){ return s; }));
  var slots = [];
  var answer = [];
  srcPool.forEach(function(s){
    var b = document.createElement('button');
    b.textContent = s;
    b.dataset.t = s;
    b.addEventListener('click', function(){
      if(b.disabled) return;
      AudioX.tap();
      if(answer.length >= q.steps.length) return;
      b.disabled = true;
      answer.push(s);
      slots[answer.length - 1].querySelector('.txt').textContent = (answer.length) + '. ' + s;
      slots[answer.length - 1].querySelector('button').disabled = false;
    });
    src.appendChild(b);
  });
  card.appendChild(src);
  var slotWrap = document.createElement('div');
  slotWrap.className = 'order-slots';
  q.steps.forEach(function(_, i){
    var slot = document.createElement('div');
    slot.className = 'order-slot';
    slot.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="txt"></span><button disabled aria-label="remove">✕</button>';
    slot.querySelector('button').addEventListener('click', function(){
      var idx = parseInt(slot.querySelector('.n').textContent, 10) - 1;
      if(idx < 0 || idx >= answer.length) return;
      var s = answer[idx];
      answer.splice(idx, 1);
      // refill slots
      srcPool.forEach(function(x){
        var el = src.querySelector('[data-t="' + x + '"]');
        if(el && el.dataset.t === s && el.disabled){ el.disabled = false; }
      });
      src.querySelectorAll('button').forEach(function(bb){ if(bb.dataset.t === s) bb.disabled = false; });
      renderSlots();
    });
    slotWrap.appendChild(slot);
    slots.push(slot);
  });
  function renderSlots(){
    slots.forEach(function(slot, i){
      slot.querySelector('.txt').textContent = i < answer.length ? (i + 1) + '. ' + answer[i] : '';
    });
  }
  card.appendChild(slotWrap);
  var check = document.createElement('button');
  check.className = 'btn btn-primary check-row';
  check.textContent = 'Check';
  check.addEventListener('click', function(){
    var ok = answer.length === q.steps.length && q.steps.every(function(s, i){ return answer[i] === s; });
    if(!ok){
      AudioX.wrong(); onWrong(); updateHud();
      mascotSay(pick(ENCOURAGE));
      toast('Try the order again!');
      answer = [];
      slots.forEach(function(slot){ slot.querySelector('.txt').textContent = ''; slot.querySelector('button').disabled = true; });
      src.querySelectorAll('button').forEach(function(bb){ bb.disabled = false; });
      return;
    }
    recordCorrect(); updateHud();
    check.disabled = true;
    celebrate(check, q);
  });
  card.appendChild(check);
  a.appendChild(card);
}

/* --- match --- */
function renderMatch(q){
  var a = qarea();
  var card = document.createElement('div');
  card.className = 'qcard';
  q._qcard = card;
  card.innerHTML = '<div class="q-tag">Match the pairs</div><div class="prompt">' + q.stem + '</div>';
  var wrap = document.createElement('div');
  wrap.className = 'pairs';
  var leftCol = document.createElement('div');
  leftCol.className = 'pair-col';
  leftCol.innerHTML = '<h5>Words</h5>';
  var rightCol = document.createElement('div');
  rightCol.className = 'pair-col';
  rightCol.innerHTML = '<h5>Match</h5>';
  wrap.appendChild(leftCol); wrap.appendChild(rightCol);
  var sel = null, matched = 0, btnMap = {};
  q.left.forEach(function(l, i){
    var b = document.createElement('button');
    b.className = 'pair-item';
    b.textContent = l;
    b.addEventListener('click', function(){
      if(b.classList.contains('ok')) return;
      AudioX.tap();
      if(sel){ sel.classList.remove('sel'); }
      sel = b; b.classList.add('sel');
    });
    leftCol.appendChild(b); btnMap[l] = b;
  });
  q.right.forEach(function(r){
    var b = document.createElement('button');
    b.className = 'pair-item';
    b.textContent = r;
    b.addEventListener('click', function(){
      if(b.classList.contains('ok') || !sel) return;
      AudioX.ensure();
      if(q.map[r] === sel.textContent){
        b.classList.add('ok'); sel.classList.add('ok'); sel.classList.remove('sel');
        matched += 1; sel = null;
        AudioX.pair();
        if(matched === q.left.length){
          recordCorrect(); updateHud();
          celebrate(b, q);
        }
      } else {
        b.classList.add('bad'); sel.classList.add('bad');
        var s2 = sel; sel = null;
        setTimeout(function(){ b.classList.remove('bad'); s2.classList.remove('bad'); }, 500);
        onWrong(); updateHud();
        AudioX.wrong();
      }
    });
    rightCol.appendChild(b);
  });
  card.appendChild(wrap);
  a.appendChild(card);
}

/* --- fill --- */
function renderFill(q){
  var a = qarea();
  var card = document.createElement('div');
  card.className = 'qcard';
  q._qcard = card;
  card.innerHTML = '<div class="q-tag">Fill the blank</div>';
  var p = document.createElement('div');
  p.className = 'prompt';
  p.textContent = q.stem.split('____')[0].trim();
  card.appendChild(p);
  var sent = document.createElement('div');
  sent.className = 'fill-sent';
  sent.innerHTML = q.stem.replace('____', '<u id="blank"></u>');
  card.appendChild(sent);
  card.appendChild(readBtn(q.stem.replace('____','...')));
  var bank = document.createElement('div');
  bank.className = 'fill-bank';
  var chosen = null;
  q.bank.forEach(function(w){
    var b = document.createElement('button');
    b.textContent = w;
    b.addEventListener('click', function(){
      AudioX.tap();
      chosen = w;
      $('blank').textContent = w;
      bank.querySelectorAll('button').forEach(function(x){ x.style.opacity = 1; });
      b.style.opacity = 0.45;
    });
    bank.appendChild(b);
  });
  card.appendChild(bank);
  var check = document.createElement('button');
  check.className = 'btn btn-primary check-row';
  check.textContent = 'Check';
  check.addEventListener('click', function(){
    if(!chosen){ toast('Tap a word first!'); return; }
    if(chosen.toLowerCase() === q.answer.toLowerCase()){
      recordCorrect(); updateHud();
      $('blank').style.background = '#DFF5E7';
      check.disabled = true;
      celebrate(check, q);
    } else {
      fail(check, q);
      $('blank').style.background = '#FDE2E8';
      setTimeout(function(){ $('blank').style.background = ''; }, 700);
    }
  });
  card.appendChild(check);
  a.appendChild(card);
}

/* --- teach-back --- */
function renderTeach(q){
  var a = qarea();
  var card = document.createElement('div');
  card.className = 'qcard';
  q._qcard = card;
  card.innerHTML = '<div class="q-tag">Read &amp; remember</div><div class="prompt">' + q.stem + '</div>';
  var rec = document.createElement('div');
  rec.className = 'recall';
  var factsBox = document.createElement('div');
  factsBox.className = 'facts';
  var ul = document.createElement('ul');
  q.facts.forEach(function(f){ var li = document.createElement('li'); li.textContent = f; ul.appendChild(li); });
  factsBox.appendChild(ul);
  var readRow = document.createElement('div');
  readRow.className = 'read-btn';
  readRow.appendChild(readBtn(q.facts.join('. ')));
  var ready = document.createElement('button');
  ready.className = 'btn btn-gold check-row';
  ready.textContent = 'I am ready!';
  rec.appendChild(factsBox);
  rec.appendChild(readRow);
  rec.appendChild(ready);
  card.appendChild(rec);
  a.appendChild(card);

  ready.addEventListener('click', function(){
    AudioX.tap();
    rec.innerHTML = '<div class="prompt-sub" style="font-size:15px;font-weight:700;color:var(--ink-soft)">Now tap the words you remember. Tap again to undo.</div>';
    var bank = document.createElement('div');
    bank.className = 'teach-bank';
    var picked = {};
    q.bank.forEach(function(w){
      var b = document.createElement('button');
      b.textContent = w;
      b.dataset.w = w;
      b.addEventListener('click', function(){
        AudioX.tap();
        b.classList.remove('bad');
        var on = b.classList.toggle('pick');
        picked[w] = on;
      });
      bank.appendChild(b);
    });
    rec.appendChild(bank);
    var check = document.createElement('button');
    check.className = 'btn btn-primary check-row';
    check.textContent = 'Check';
    check.addEventListener('click', function(){
      var correct = true;
      q.answers.forEach(function(x){ if(!picked[x]) correct = false; });
      q.bank.forEach(function(x){ if(picked[x] && q.answers.indexOf(x) < 0) correct = false; });
      if(!correct){
        q.bank.forEach(function(x){
          if(picked[x] && q.answers.indexOf(x) < 0){
            var bb = bank.querySelector('button[data-w="' + x + '"]');
            if(bb){ bb.classList.remove('pick'); bb.classList.add('bad'); }
            picked[x] = false;
          }
        });
        AudioX.wrong(); onWrong(); updateHud();
        mascotSay(pick(ENCOURAGE) + ' Tap the words that were in the sentence.');
        return;
      }
      recordCorrect(); updateHud();
      check.disabled = true;
      celebrate(check, q);
    });
    rec.appendChild(check);
  });
}

/* ---------- main question entry ---------- */
function renderQuestion(){
  var c = currentCard();
  var q = buildQuestion(c.fact, c.type);
  cardProgress();
  updateHud();
  mascotSay(pick(INTROS));
  var readMe = false;
  if(q.type === 'mcq') renderMcq(q);
  else if(q.type === 'tf') renderTf(q);
  else if(q.type === 'sort') renderSort(q);
  else if(q.type === 'order') renderOrder(q);
  else if(q.type === 'match') renderMatch(q);
  else if(q.type === 'fill') renderFill(q);
  else if(q.type === 'teach') renderTeach(q);
  else renderMcq(q);
  var badge = $('view-play').querySelector('.q-tag');
}

/* ---------- mission entry ---------- */
function startChapter(id){
  AudioX.ensure();
  buildMission('chapter', id);
  go('view-play');
  startTimer();
  renderQuestion();
}
function startMix(){
  AudioX.ensure();
  buildMission(store.settings.mixFresh ? 'mix' : 'mix');
  if(!store.settings.mixFresh){ /* fresh mix: ignore weak weighting */
    var all = allFacts();
    var n = Math.min(6 + Math.floor(Math.random()*3), all.length);
    S.cards = shuffle(all).slice(0, n).map(function(f){ return { fact:f, type:pickType(f) }; });
  }
  go('view-play');
  startTimer();
  renderQuestion();
}
function startLightning(){
  AudioX.ensure();
  buildMission('lightning');
  go('view-play');
  startTimer();
  renderQuestion();
}

/* ---------- event wiring ---------- */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var act = el.getAttribute('data-action');
  if(act === 'toggle-sound'){
    store.settings.sound = !store.settings.sound;
    AudioX.muted = !store.settings.sound;
    if(store.settings.sound){ AudioX.ensure(); AudioX.tap(); }
    storeSave(); updateSoundIcon();
  }
  else if(act === 'go-home'){
    if(!$('view-play').classList.contains('hidden') && !S.finished){ endMission('early'); }
    else if(!$('view-done').classList.contains('hidden')){ /* stay */ }
    go('view-home');
  }
  else if(act === 'toggle-shuffle'){
    store.settings.shuffle = !store.settings.shuffle; storeSave(); renderHome();
  }
  else if(act === 'toggle-mix'){
    store.settings.mixFresh = !store.settings.mixFresh; storeSave(); renderHome();
  }
  else if(act === 'pick-timer'){
    var opts = [5,6,7,8];
    var i = opts.indexOf(store.settings.timerMin);
    store.settings.timerMin = opts[(i + 1) % opts.length];
    storeSave(); renderHome(); toast('Mission time: ' + store.settings.timerMin + ' min');
  }
  else if(act === 'start-mix'){ startMix(); }
  else if(act === 'start-lightning'){ startLightning(); }
  else if(act === 'open-parent'){ go('view-parent'); }
  else if(act === 'exit-early'){ endMission('early'); }
  else if(act === 'play-again'){
    var mode = S.mode, cid = S.chapterId;
    if(mode === 'chapter') startChapter(cid);
    else if(mode === 'lightning') startLightning();
    else startMix();
  }
  else if(act === 'reset-progress'){
    if(!confirm('Reset all progress and stars?')) return;
    try{ localStorage.removeItem(STORE_KEY); }catch(e){}
    storeLoad(); go('view-home');
  }
});

/* ---------- PWA ---------- */
function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

/* ---------- init ---------- */
document.addEventListener('pointerdown', function once(){
  AudioX.ensure();
  document.removeEventListener('pointerdown', once);
});
window.addEventListener('hashchange', router);
loadCards().then(function(){
  updateSoundIcon();
  renderHome();
  router();
  registerSW();
  try{ window.speechSynthesis && window.speechSynthesis.getVoices(); }catch(e){}
});

</script>
